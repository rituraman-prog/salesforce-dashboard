name: Process Salesforce CSV and Update Dashboard

on:
  # Trigger when CSV files are pushed to uploads/
  push:
    paths:
      - 'uploads/*.csv'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  process-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pandas openpyxl

      - name: 🗑️ Clear database for fresh import
        run: |
          # Ensure data directory exists
          mkdir -p data

          python3 << 'EOF'
          import sys
          sys.path.insert(0, '.')
          from db_helper import get_db_connection, init_database

          # Initialize database (creates table if needed)
          init_database()

          # Clear all data
          conn = get_db_connection()
          cursor = conn.cursor()

          print("🗑️ Clearing database...")
          cursor.execute('DELETE FROM opportunities')
          conn.commit()

          count = cursor.execute('SELECT COUNT(*) FROM opportunities').fetchone()[0]
          print(f"✅ Database cleared! Records: {count}")

          conn.close()
          EOF

      - name: 📊 Process latest CSV
        run: |
          python3 << 'EOF'
          import sys
          import os
          import glob

          sys.path.insert(0, '.')
          from app import process_csv, read_csv_with_encoding

          # Find latest CSV
          csv_files = glob.glob('uploads/*.csv')
          if not csv_files:
              print("❌ No CSV files found in uploads/")
              sys.exit(1)

          latest_csv = max(csv_files, key=os.path.getctime)
          print(f"📄 Processing: {latest_csv}")
          print()

          try:
              df = read_csv_with_encoding(latest_csv)
              print(f"✅ Read {len(df)} records from CSV")

              result = process_csv(df, latest_csv)

              if result.get('success'):
                  print(f"\n✅ Processing complete!")
                  print(f"   New records: {result.get('new', 0)}")
                  print(f"   Updated records: {result.get('updated', 0)}")
                  print(f"   TOTAL: {result.get('new', 0) + result.get('updated', 0)}")
                  sys.exit(0)
              else:
                  print(f"❌ Error: {result.get('error', 'Unknown')}")
                  sys.exit(1)
          except Exception as e:
              print(f"❌ Error: {str(e)}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: 📤 Export to JSON
        run: python3 export_to_json.py

      - name: 🔄 Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add data/opportunities.json data/last_sync.txt

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          RECORD_COUNT=$(grep "Total opportunities" data/last_sync.txt | awk '{print $3}')
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')

          git commit -m "🤖 Auto-update: $RECORD_COUNT opportunities ($TIMESTAMP)"
          git push

          echo ""
          echo "========================================="
          echo "✅ Dashboard Updated Successfully!"
          echo "========================================="
          echo "📊 Opportunities: $RECORD_COUNT"
          echo "🌐 Dashboard: https://rituraman-prog.github.io/salesforce-dashboard/"
          echo "========================================="
