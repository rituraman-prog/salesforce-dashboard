<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Opportunities Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .last-updated {
            color: #666;
            font-size: 0.9em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #333;
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-card.holdback .stat-value { color: #f39c12; }
        .stat-card.framework .stat-value { color: #3498db; }
        .stat-card.umbrella .stat-value { color: #9b59b6; }
        .stat-card.total .stat-value { color: #27ae60; }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .region-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .region-name {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .region-stats {
            color: #666;
            font-size: 0.9em;
        }

        .region-stats div {
            margin: 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .amount {
            font-weight: bold;
            color: #27ae60;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge.holdback { background: #ffe5b4; color: #d68910; }
        .badge.framework { background: #d4e9f7; color: #1f618d; }
        .badge.umbrella { background: #e8daef; color: #6c3483; }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            border: 2px solid #f66;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .filters {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #764ba2;
        }

        .auto-refresh {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Salesforce Opportunities Dashboard</h1>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </div>

        <div class="auto-refresh">
            🔄 Data auto-refreshes hourly | Last check: <span id="lastCheck">--:--</span>
        </div>

        <div class="stats" id="stats">
            <div class="loading">Loading statistics...</div>
        </div>

        <div class="content">
            <h2>📈 Regional Breakdown</h2>
            <div class="regions-grid" id="regions">
                <div class="loading">Loading regions...</div>
            </div>
        </div>

        <div class="content">
            <h2>📋 All Opportunities</h2>

            <div class="filters">
                <select class="filter-select" id="regionFilter">
                    <option value="">All Regions</option>
                </select>
                <select class="filter-select" id="termFilter">
                    <option value="">All Special Terms</option>
                    <option value="Holdback">Holdback</option>
                    <option value="Framework">Framework</option>
                    <option value="Umbrella">Umbrella</option>
                </select>
            </div>

            <div id="tableContainer">
                <div class="loading">Loading opportunities...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Updated with your GitHub username
        const GITHUB_USERNAME = 'rituraman-prog';
        const REPO_NAME = 'salesforce-dashboard';
        const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/data/opportunities.json`;

        let allData = null;
        let filteredOpportunities = [];

        // Load data from GitHub
        async function loadData() {
            try {
                console.log('Fetching data from:', DATA_URL);
                const response = await fetch(DATA_URL + '?t=' + Date.now()); // Cache bust

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                allData = await response.json();
                filteredOpportunities = allData.opportunities;

                displayStats();
                displayRegions();
                displayTable();
                updateLastUpdated();
                populateFilters();

                document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').innerHTML = `
                    <div class="error">
                        <strong>Error loading data:</strong><br>
                        ${error.message}<br><br>
                        Make sure to update GITHUB_USERNAME and REPO_NAME in index.html!<br>
                        Data URL: ${DATA_URL}
                    </div>
                `;
            }
        }

        function displayStats() {
            const stats = allData.statistics;
            const statsHTML = `
                <div class="stat-card total">
                    <div class="stat-label">Total Opportunities</div>
                    <div class="stat-value">${allData.total_opportunities}</div>
                </div>
                <div class="stat-card holdback">
                    <div class="stat-label">Holdback</div>
                    <div class="stat-value">${stats.holdback_count}</div>
                </div>
                <div class="stat-card framework">
                    <div class="stat-label">Framework</div>
                    <div class="stat-value">${stats.framework_count}</div>
                </div>
                <div class="stat-card umbrella">
                    <div class="stat-label">Umbrella</div>
                    <div class="stat-value">${stats.umbrella_count}</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHTML;
        }

        function displayRegions() {
            const regionsHTML = allData.regions.map(region => `
                <div class="region-card">
                    <div class="region-name">${region.region}</div>
                    <div class="region-stats">
                        <div>📊 Total: <strong>${region.count}</strong></div>
                        <div>💰 Amount: <strong>$${formatNumber(region.total_amount)}</strong></div>
                    </div>
                </div>
            `).join('');
            document.getElementById('regions').innerHTML = regionsHTML;
        }

        function displayTable() {
            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Account</th>
                            <th>Special Term</th>
                            <th>Region</th>
                            <th>Amount</th>
                            <th>Close Date</th>
                            <th>Stage</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredOpportunities.map(opp => `
                            <tr>
                                <td>${opp.name || 'N/A'}</td>
                                <td>${opp.account_name || 'N/A'}</td>
                                <td>
                                    ${opp.special_term ? `<span class="badge ${opp.special_term.toLowerCase()}">${opp.special_term}</span>` : 'N/A'}
                                </td>
                                <td>${opp.region || 'N/A'}</td>
                                <td class="amount">$${formatNumber(opp.amount || 0)}</td>
                                <td>${formatDate(opp.close_date)}</td>
                                <td>${opp.stage_name || 'N/A'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('tableContainer').innerHTML = tableHTML;
        }

        function updateLastUpdated() {
            const lastUpdated = new Date(allData.last_updated);
            document.getElementById('lastUpdated').textContent =
                `Last updated: ${lastUpdated.toLocaleString()}`;
        }

        function populateFilters() {
            // Get unique regions
            const regions = [...new Set(allData.opportunities.map(o => o.region).filter(Boolean))];
            const regionFilter = document.getElementById('regionFilter');
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionFilter.appendChild(option);
            });
        }

        function applyFilters() {
            const regionFilter = document.getElementById('regionFilter').value;
            const termFilter = document.getElementById('termFilter').value;

            filteredOpportunities = allData.opportunities.filter(opp => {
                if (regionFilter && opp.region !== regionFilter) return false;
                if (termFilter && opp.special_term !== termFilter) return false;
                return true;
            });

            displayTable();
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(Math.round(num));
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString();
        }

        // Event listeners
        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('termFilter').addEventListener('change', applyFilters);

        // Auto-refresh every 5 minutes
        setInterval(loadData, 5 * 60 * 1000);

        // Initial load
        loadData();
    </script>
</body>
</html>
